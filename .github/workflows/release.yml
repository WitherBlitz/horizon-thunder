name: Build and release modpack

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.17.5
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests -v
        env:
          HORIZON_VERIFY_DOWNLOADS: "1"
      - name: Check release tag matches the pack version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open("modrinth.index.json"))["versionId"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match versionId"
          PY
      - run: python build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-thunder
          path: |
            dist/*
            RELEASE_NOTES.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: horizon-thunder
      - name: Publish installable pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Horizon Thunder $GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
